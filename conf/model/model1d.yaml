# model class
model_name: DriftDiffusionModel

# if cuda not available choose 'cpu'
device: cpu

# model specific parameters (ignored if not applicable for chosen model)
sigma: 0.3
drift: 2
rho: 1e-3

data_dim: 1
drift_mlp_width: 256
jump_mlp_width: 256

loss_function: ikl

memory_length: 10
time_sampling: uniform_index # alternative: uniform_time

#new sigma training
sigma_width: 128
memory_switch: "off"
bridge_noise_mode: ml # constant, ml oder learned
sigma_tau: 0.1
sigma_tau_lr: 1e-2

trainable_parts: ["drift", "uncertainty"] #["drift", "uncertainty"]
