# model class
model_name: DriftDiffusionModel

# if cuda not available choose 'cpu'
device: cpu

# model specific parameters (ignored if not applicable for chosen model)
sigma: 0.3
drift: 2
rho: 1e-3

data_dim: 1
drift_mlp_width: 256
jump_mlp_width: 256

loss_function: ikl

memory_length: 10
time_sampling: uniform_index # alternative: uniform_time

#new sigma training
sigma_width: 128
memory_switch: off
max_likelihood: off
